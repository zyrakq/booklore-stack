services:
  booklore:
    # JVM apps have no NODE_EXTRA_CA_CERTS equivalent: the step-ca root CA
    # must be imported into the JVM truststore (cacerts). The image's
    # entrypoint.sh drops privileges via su-exec, so the import runs in an
    # entrypoint wrapper as root BEFORE the app starts — this re-runs on
    # every container start, so recreates never lose the trust.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /step-ca-root/root_ca.crt ]; then
          keytool -delete -alias step-ca-root -cacerts -storepass changeit >/dev/null 2>&1 || true
          keytool -importcert -noprompt -alias step-ca-root -cacerts -storepass changeit \
            -file /step-ca-root/root_ca.crt >/dev/null 2>&1 \
            && echo "step-ca root CA imported into JVM truststore" \
            || echo "WARNING: step-ca root CA import failed"
        fi
        exec entrypoint.sh "$$@"
      - --
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - type: volume
        source: step-ca-data
        target: /step-ca-root
        read_only: true
        volume:
          subpath: certs

volumes:
  step-ca-data:
    external: true
