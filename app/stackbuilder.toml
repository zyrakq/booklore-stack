[paths]
environments_path = "./environments"

[build]
skip_base_generation = true
yaml_merger = "yq"
# Extension pool: oidc is mandatory infra (§10) — provider configured via
# the app's settings UI (stored in MariaDB, no env surface). step-ca-trust
# is mandatory infra for the step-ca environment (JVM outbound TLS trust).
extensions = ["oidc", "step-ca-trust"]

[build.combos]
# ONE base combo = the functional base (app + mandatory MariaDB booklore-db
# + oidc).
entire = ["oidc"]
# step-ca variant adds CA trust for outbound TLS (OIDC discovery).
entire-trust = ["oidc", "step-ca-trust"]

[build.environments]
available = ["forwarding", "letsencrypt", "step-ca"]

[build.environments.forwarding]
extensions = []
combos = ["entire"]

[build.environments.letsencrypt]
extensions = []
combos = ["entire"]

[build.environments.step-ca]
extensions = []
combos = ["entire-trust"]
